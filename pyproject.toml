[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-fraud-shield"
version = "1.0.0"
description = "Federated fraud detection across banks with robust aggregation, differential privacy, secure aggregation and a model service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "pandas>=2.0",
    "matplotlib>=3.8",  # the experiment plots
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "cryptography>=42",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]
realdata = ["pyarrow>=15"]
dashboard = ["streamlit>=1.40", "plotly>=5.18"]

[project.scripts]
fedshield = "fedshield.__main__:main"

[tool.setuptools]
packages = ["fedshield"]

[tool.setuptools.package-data]
fedshield = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["fedshield"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]  # Depends() defaults are FastAPI's idiom; zip(strict=) is style
